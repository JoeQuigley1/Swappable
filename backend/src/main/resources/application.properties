spring.application.name=backend
server.port=8080

# Environment variables import from .env file
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:your_jwt_secret_here}
jwt.expiration=86400000

# Development only - exposes exception messages in API responses
server.error.include-message=always
server.error.include-binding-errors=always

# Brevo transactional email HTTP API (with fallback so startup doesn't crash)
brevo.api.url=${BREVO_API_URL:https://api.brevo.com}
brevo.api.key=${BREVO_API_KEY:dummy_brevo_key}

# Application
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:noreply@swappable.com}

# Image upload limits (raw upload size, before we compress to WebP)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB