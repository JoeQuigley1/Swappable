spring.application.name=backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/swappable
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Development only - exposes exception messages in API responses
server.error.include-message=always
server.error.include-binding-errors=always

# Email
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:noreply@swappable.com}

# Image upload limits (raw upload size, before we compress to WebP)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB