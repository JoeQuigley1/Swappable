services:
  postgres-db:
    image: postgres:15-alpine
    container_name: swappable-db
    environment:
      POSTGRES_DB: swappable
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-116699}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swappable"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-app:
    build: .
    container_name: swappable-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/swappable
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-116699}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create
      - JWT_SECRET=${JWT_SECRET:-3c9c34a2a51d428bda4c5f822a16d594b2a514d82bfa8c716e251b1a43a2}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata: